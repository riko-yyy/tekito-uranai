<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="55%" stop-color="#15151a"/>
      <stop offset="100%" stop-color="#0e0e0f"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2a3f63"/>
      <stop offset="55%" stop-color="#16233a"/>
      <stop offset="100%" stop-color="#0e0e0f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="slip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9e9ea"/>
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="100%" stop-color="#dba735"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="400" r="420" fill="url(#glow)"/><g transform="translate(512 512) scale(1.8) translate(-512 -512)">

  <!-- fortune slip (omikuji), slightly rotated, centered -->
  <g transform="rotate(-6 512 542)" filter="url(#softShadow)">
    <rect x="402" y="352" width="220" height="380" rx="16" fill="url(#slip)"/>
    <!-- vertical text-column hints -->
    <rect x="446" y="466" width="9" height="230" rx="4.5" fill="#c9c9cc"/>
    <rect x="489" y="466" width="9" height="230" rx="4.5" fill="#c9c9cc"/>
    <rect x="532" y="466" width="9" height="140" rx="4.5" fill="#c9c9cc"/>
    <rect x="575" y="466" width="9" height="180" rx="4.5" fill="#c9c9cc"/>
    <!-- top cap accent -->
    <rect x="402" y="352" width="220" height="58" rx="16" fill="#16233a"/>
    <rect x="402" y="402" width="220" height="6" fill="#d8d8da"/>
  </g>

  <!-- gold sparkle, main -->
  <g filter="url(#softShadow)">
    <path d="M 672 268
             C 677 318, 694 335, 744 340
             C 694 345, 677 362, 672 412
             C 667 362, 650 345, 600 340
             C 650 335, 667 318, 672 268 Z" fill="url(#gold)"/>
  </g>
  <circle cx="628" cy="424" r="9" fill="url(#gold)" opacity="0.85"/>
</g></svg>